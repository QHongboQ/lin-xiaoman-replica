<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时笺 · TimeAwareness</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 防止浅色主题闪烁（FOUC）：AstrBot 主 webui 注入 localStorage 主题
    (function () {
      try {
        var t = localStorage.getItem('astrbot-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">时笺·TimeAwareness</div>
        <div class="sidebar-subtitle">智能日历与角色日程</div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          概览
        </button>
        <button class="nav-item" data-view="calendar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          日历
        </button>
        <button class="nav-item" data-view="static-schedules">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="7" cy="6" r="1"/><circle cx="11" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
          静态日程
        </button>
        <button class="nav-item" data-view="schedules">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          人格日程
        </button>
      </nav>
      <div class="sidebar-footer">
        <div><span id="version-tag">—</span></div>
        <div id="plugin-name-tag" style="opacity: 0.7; margin-top: 2px;">time_awareness</div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-title">
          <span id="view-title">概览</span>
          <span id="schedule-current-time" class="schedule-current-time" style="display:none"></span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="refresh-view" title="刷新当前视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" id="theme-toggle" title="切换主题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="btn btn-primary btn-sm" id="sch-add-slot-top" style="display:none">+ 新增时段</button>
          <button class="btn btn-primary btn-sm" id="sch-save-top" style="display:none">保存修改</button>
        </div>
      </header>

      <main class="content">
        <!-- ===== 概览 ===== -->
        <section class="view active" data-view="dashboard">
          <div id="dashboard-content">
            <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
          </div>
        </section>

        <!-- ===== 日历 ===== -->
        <section class="view" data-view="calendar">
          <div class="calendar-toolbar">
            <div class="calendar-nav">
              <button class="btn btn-sm" id="cal-prev">‹</button>
              <div class="calendar-title" id="cal-title">—</div>
              <button class="btn btn-sm" id="cal-next">›</button>
              <button class="btn btn-sm" id="cal-today">今</button>
            </div>
            <div class="calendar-legend">
              <span class="legend-item"><span class="legend-dot builtin"></span>内置事件</span>
              <span class="legend-item"><span class="legend-dot custom"></span>自定义事件</span>
            </div>
          </div>
          <div class="calendar-grid" id="calendar-grid">
            <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
          </div>
        </section>

        <!-- ===== 日程 ===== -->
        <section class="view" data-view="static-schedules">
          <div class="static-schedules-toolbar">
            <div class="static-schedules-hint">列表顺序即重叠时的优先级；跨午夜时结束时间可早于开始时间。</div>
            <div class="static-schedules-actions">
              <button class="btn btn-sm" id="static-reload">重新加载</button>
              <div class="dropdown" id="static-add-dropdown">
                <button class="btn btn-primary btn-sm" id="static-add-main">+ 新增时段 ▾</button>
                <div class="dropdown-menu" id="static-add-menu">
                  <button class="dropdown-item" type="button" data-preset="time_slot">⏰ 普通时段</button>
                  <button class="dropdown-item" type="button" data-preset="sleep_slot">🌙 睡眠预设</button>
                  <button class="dropdown-item" type="button" data-preset="lunch_slot">🍜 午餐预设</button>
                  <button class="dropdown-item" type="button" data-preset="dinner_slot">🍲 晚餐预设</button>
                </div>
              </div>
              <button class="btn btn-primary btn-sm" id="static-save">保存修改</button>
            </div>
          </div>
          <div id="static-schedules-content">
            <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
          </div>
        </section>

        <!-- ===== 人格日程 ===== -->
        <section class="view" data-view="schedules">
          <div class="schedules-toolbar">
            <label class="form-label">人格</label>
            <select id="sch-persona" class="form-input"></select>
            <label class="form-label">日期</label>
            <select id="sch-date" class="form-input"></select>
          </div>
          <div id="schedules-content">
            <div class="loading-wrap"><span class="spinner"></span> 加载中...</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 通用确认 modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal">
      <div class="modal-title" id="confirm-title">确认操作</div>
      <div class="modal-body" id="confirm-body">确定要执行此操作吗？</div>
      <div class="modal-actions">
        <button class="btn" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确认</button>
      </div>
    </div>
  </div>

  <!-- 单日事件 modal -->
  <div class="modal-overlay" id="day-modal">
    <div class="modal">
      <div class="modal-title" id="day-modal-title">—</div>
      <div class="modal-body" id="day-modal-body"></div>
      <div class="modal-actions">
        <button class="btn" id="day-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 静态日程单条编辑 modal：页面始终只挂载这一份输入控件 -->
  <div class="modal-overlay" id="static-slot-modal">
    <div class="modal" style="max-width: 620px;">
      <div class="modal-title" id="static-slot-modal-title">编辑静态时段</div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label" for="sf-name">名称 <span class="form-hint">（最多 24 字）</span></label>
          <input type="text" id="sf-name" class="form-input" maxlength="24" placeholder="如：晨起、午休、深夜" />
        </div>
        <div class="static-time-fields">
          <div class="form-row">
            <label class="form-label" for="sf-start">开始时间</label>
            <input type="text" id="sf-start" class="form-input" maxlength="5" placeholder="HH:MM" />
          </div>
          <div class="form-row">
            <label class="form-label" for="sf-end">结束时间 <span class="form-hint">（允许 24:00）</span></label>
            <input type="text" id="sf-end" class="form-input" maxlength="5" placeholder="HH:MM" />
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="sf-state">状态描述 <span class="form-hint">（最多 500 字）</span></label>
          <textarea id="sf-state" class="form-input" rows="6" maxlength="500" placeholder="描述该时段的生理、情绪和回应风格"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="sf-cancel">取消</button>
        <button class="btn btn-primary" id="sf-submit">应用到草稿</button>
      </div>
    </div>
  </div>

  <!-- toast 容器 -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
